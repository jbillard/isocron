[workspace]
members = [
    "crates/isc-syntax",
    "crates/isc-types",
    "crates/isc-ir",
    "crates/isc-interp",
    "crates/isc-codegen",
    "crates/isc-runtime-core",
    "crates/isc-mem",
    "crates/iscc",
    "crates/isc-lsp",
]
resolver = "2"
# built by crates/iscc/build.rs with panic = "abort"
exclude = ["crates/isc-runtime"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

# isc-mem is `memcpy` itself: unoptimised, its copies of a fixed size are
# calls of `memcpy` (D288); its tests run the code of the runtime
[profile.dev.package.isc-mem]
opt-level = 3
