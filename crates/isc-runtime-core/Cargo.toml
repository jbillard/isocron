[package]
name = "isc-runtime-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# the mathematical functions of musl, in Rust, without std: one
# implementation for the interpreter and every target (D108)
libm = { version = "0.2", default-features = false }
# arbitrary integers (`bigint`, D156), without std: the same code for the
# interpreter and every target (the runtime gives `alloc` its allocator)
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
# regular expressions in linear time (D157): the engine of the crate `regex`,
# without std
regex-automata = { version = "0.4", default-features = false, features = ["alloc", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid", "dfa-onepass", "unicode", "perf-literal-substring", "perf-literal-multisubstring"] }
# the syntax tree of a pattern (the one regex-automata parses), to find the
# simple shapes searched by masks (D224); the search of a byte in them
regex-syntax = { version = "0.8", default-features = false }
memchr = { version = "2", default-features = false }
