# The Rust programs of the Benchmarks Game, one at a time as src/main.rs
# (build_programs.sh); the dependencies of all of them fetched when the image
# is built.
[package]
name = "bg"
version = "0.1.0"
edition = "2021"
# the versions of the dependencies that build with the Rust of their
# command lines (Cargo 1.84 picks them: .cargo/config.toml)
rust-version = "1.84"

[dependencies]
rayon = "=1.12.0"
bumpalo = "3"
num_cpus = "1"
spin = "0.9"
futures = "0.1"
tokio-threadpool = "0.1"
hashbrown = "0.14"
itertools = "0.13"
num = "0.4"
rug = { version = "1.12", default-features = false, features = ["integer"] }
gmp-mpfr-sys = { version = "1", default-features = false, features = ["use-system-libs"] }
libc = "0.2"
pcre2-sys = "=0.2.9"
memchr = "2"

[profile.release]
opt-level = 3
codegen-units = 1
