# lighttpd: `hello, world!` from a file (it serves by one process, its
# event loop)
server.document-root = "/tmp/http-root"
server.port = 8082
server.bind = "127.0.0.1"
server.pid-file = "/tmp/lighttpd.pid"
server.errorlog = "/dev/null"
server.max-keep-alive-requests = 65535
server.max-connections = 4096
server.max-fds = 8192
index-file.names = ( "index.html" )
mimetype.assign = ( ".html" => "text/plain" )
