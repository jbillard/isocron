# nginx: 4 workers, `hello, world!` from the configuration (no file read)
worker_processes 4;
daemon off;
error_log /dev/null crit;
pid /tmp/nginx.pid;
events {
    worker_connections 4096;
}
http {
    access_log off;
    keepalive_requests 1000000;
    client_body_temp_path /tmp;
    proxy_temp_path /tmp;
    fastcgi_temp_path /tmp;
    uwsgi_temp_path /tmp;
    scgi_temp_path /tmp;
    server {
        listen 127.0.0.1:8081;
        location / {
            default_type text/plain;
            return 200 "hello, world!";
        }
    }
}
